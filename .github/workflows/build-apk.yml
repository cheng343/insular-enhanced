name: Build Insular Enhanced APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          expected=$(curl --fail --silent --show-error --location https://services.gradle.org/distributions/gradle-8.13-wrapper.jar.sha256)
          printf '%s  gradle/wrapper/gradle-wrapper.jar\n' "$expected" | sha256sum --check -
      - name: Install required Android SDK packages
        run: sdkmanager 'platforms;android-35' 'platforms;android-26' 'build-tools;34.0.0'
      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./gradlew :assembly:assembleCompleteFdroidDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log
      - name: Record checksums and source revision
        run: |
          mkdir -p artifacts
          cp assembly/build/outputs/apk/completeFdroid/debug/*.apk artifacts/
          git rev-parse HEAD > artifacts/SOURCE_COMMIT.txt
          git submodule status >> artifacts/SOURCE_COMMIT.txt
          cd artifacts && sha256sum *.apk > SHA256SUMS.txt
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: insular-enhanced-debug-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
